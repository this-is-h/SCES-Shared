name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  branch-name:
    name: 分支名校验（简化版 Git Flow）
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: 校验分支前缀
        run: |
          ref="${{ github.ref_name }}"
          case "$ref" in
            main|develop|feature/*|bugfix/*|hotfix/*|chore/*|release/*)
              ;;
            *)
              echo "::error::分支名违规：$ref"
              exit 1
              ;;
          esac

  build-and-test:
    name: 编译 + 测试（覆盖率 ≥80%）+ 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 编译门禁
        run: pnpm build
      - name: 测试门禁（覆盖率阈值在 vitest.config.ts，≥80% 否则失败）
        run: pnpm test:coverage
        env:
          SCES_NO_SIBLING: '1'
      - name: 类型检查门禁
        run: pnpm type-check

  supply-chain-audit:
    name: 供应链安全检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  gitleaks:
    name: 密钥泄漏扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
